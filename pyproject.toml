[project]
name = "horragor-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "polars>=1.40.0",
    "pyspark>=4.1.1",
    "streamlit>=1.58.0",
    "faiss-cpu>=1.14.2",
    "psycopg2>=2.9.12",
    "sentence-transformers>=5.5.1",
    "fastapi>=0.136.3",
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.2",
    "beautifulsoup4>=4.14.3",
    "langgraph>=0.2.60",
    "langfuse>=2.53.9",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "loguru>=0.7.3",
    "selenium>=4.18.1",
    "webdriver-manager>=4.0.1",
    "pyjwt>=2.10.1",
    "bcrypt>=4.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "sphinx>=8.1.3",
    "furo>=2024.8.6",
    "myst-parser>=4.0.0",
    "sphinxcontrib-openapi>=0.8.4",
    "sphinxcontrib-mermaid>=1.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.77",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=src --cov=app_frontend --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
relative_files = true
omit = [
    "src/__init__.py",
    "src/*/__init__.py",
]
