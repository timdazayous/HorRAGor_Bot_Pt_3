name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Couche Intelligence — lint (src/ + tests/ + UI)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check src/ tests/ test_api.py test_e2e.py app_frontend.py

  # ---------------------------------------------------------------------------
  # Couche Intelligence (API) + Couche Présentation (UI Streamlit) — tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests & couverture (≥80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Lancer la suite de tests avec couverture
        run: uv run pytest
        env:
          GROQ_API_KEY: dummy-not-used-tests-are-mocked
          JWT_SECRET_KEY: dummy-ci-secret-not-used-in-prod
      - name: Scénario de bout en bout — couche sécurité (test_e2e.py)
        run: uv run python test_e2e.py
        env:
          JWT_SECRET_KEY: dummy-ci-secret-not-used-in-prod

  # ---------------------------------------------------------------------------
  # Documentation Sphinx — doit rester générable sans avertissement
  # ---------------------------------------------------------------------------
  docs:
    name: Documentation (Sphinx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Générer la spec OpenAPI et le diagramme du graphe
        run: |
          uv run python docs/generate_openapi.py
          uv run python docs/generate_graph_diagram.py
        env:
          JWT_SECRET_KEY: dummy-ci-secret-not-used-in-prod
      - name: Build Sphinx (warnings = erreurs)
        run: uv run sphinx-build -b html docs/source docs/build -W

  # ---------------------------------------------------------------------------
  # Les 3 couches — chaque image Docker doit se construire sans erreur
  # (Gouvernance : CI étendue à Données/db-api et Présentation/frontend, pas
  # seulement l'API comme avant)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build images Docker (3 couches)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.api
            tag: horragor-api:ci
          - dockerfile: Dockerfile.dbapi
            tag: horragor-dbapi:ci
          - dockerfile: Dockerfile.frontend
            tag: horragor-frontend:ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.dockerfile }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}

  # ---------------------------------------------------------------------------
  # CD — publie les 3 images sur GHCR uniquement sur push vers main, une fois
  # tout vert
  # ---------------------------------------------------------------------------
  publish:
    name: Publier les images (GHCR)
    needs: [lint, test, docs, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.api
            image: api
          - dockerfile: Dockerfile.dbapi
            image: dbapi
          - dockerfile: Dockerfile.frontend
            image: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Gouvernance — un échec sur main devient automatiquement une Issue
  # GitHub trackée (anomalie), plutôt que de rester invisible dans les logs
  # Actions. Ne s'exécute jamais sur une PR : seul un échec sur main (déjà
  # mergé) constitue une vraie anomalie à tracker.
  # ---------------------------------------------------------------------------
  report-failure:
    name: Ouvrir une Issue si la CI échoue sur main
    needs: [lint, test, docs, docker-build]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI en échec sur main — ${context.sha.slice(0, 7)}`,
              labels: ["anomalie", "ci"],
              body: [
                `La CI a échoué sur \`main\` au commit ${context.sha}.`,
                ``,
                `Logs : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n"),
            });
