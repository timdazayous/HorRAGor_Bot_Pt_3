apiVersion: 1

groups:
  - orgId: 1
    name: horragor-alerts
    folder: HorRAGor
    interval: 1m
    rules:
      - uid: horragor-error-burst
        title: "Rafale d'erreurs API"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Plus de 3 erreurs journalisées par l'API HorRAGor en 2 minutes."
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 120
              to: 0
            model:
              refId: A
              queryType: range
              expr: 'count_over_time({job="horragor-api"} | json | level="ERROR" [2m])'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 120
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
